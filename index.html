<style>
:root{--bg:#000;--card:#111214;--card2:#1a1b1f;--txt:#f2f2f5;--mut:#8b8d96;--line:#26272c;
--green:#34d17a;--amber:#ffb020;--red:#ff4d5e;--blue:#4da3ff;--cal:#ff7a45;--burn:#8a7dff;--gym:#c86bff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{max-width:520px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav{background:var(--card2);border:0;color:var(--txt);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.nav:disabled{opacity:.25}
.dsel{flex:1;text-align:center}
.dsel .d{font-size:19px;font-weight:700;letter-spacing:.2px}
.dsel select{margin-top:4px;background:var(--card2);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:3px 8px;font-size:12px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#1f2a22;color:var(--green);margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.5px}
.chip.hit{background:#2c1d1f;color:var(--red)}.chip.rest{background:#1d2330;color:var(--blue)}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;justify-content:space-between}
.card h2 span{text-transform:none;letter-spacing:0;font-weight:500}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ring{background:var(--card2);border-radius:16px;padding:10px 6px 10px;text-align:center}
.ring svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
.ring .lab{font-size:13px;font-weight:700;margin-top:4px}
.ring .st{font-size:11px;font-weight:600;margin-top:2px}
.ring .rg{font-size:11px;color:var(--mut);margin-top:1px}
.calrow{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.big small{font-size:14px;color:var(--mut);font-weight:600;margin-left:3px}
.net{text-align:right}
.net .v{font-size:22px;font-weight:800}
.net .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.bar{position:relative;height:14px;border-radius:7px;background:var(--card2);overflow:hidden;margin:6px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.legend strong{color:var(--txt)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.burnsplit{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
.meal{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.meal:first-of-type{border-top:0}
.meal .t{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;padding-top:2px}
.meal .n{font-size:14px;line-height:1.3}
.meal .m{font-size:11px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.meal .m em{font-style:normal;margin-right:7px}
.meal .k{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding-top:10px;border-top:1px solid #3a3b42;font-weight:700;font-size:13px}
.tot .m{font-size:11px;color:var(--mut);font-weight:600;margin-top:3px}
.trend svg{width:100%;height:auto;display:block}
.tl{font-size:12px;color:var(--mut);margin:4px 0 2px}
.empty{color:var(--mut);font-size:13px;padding:8px 0}
.wk svg.wd{width:100%;height:auto;display:block;margin-top:10px}
.wk .rg b{color:var(--txt);font-weight:700}
.wk .rings{grid-template-columns:1fr 1fr 1fr;gap:8px}
.wk .ring{padding:9px 4px}
.wk .ring svg{max-width:120px}
.wk .ring .lab{font-size:12px}
.wk .ring .st,.wk .ring .rg{font-size:10.5px;line-height:1.25}
.gymday{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:10px 0 2px;margin-top:8px;border-top:1px solid #3a3b42;align-items:start}
.gymday .t{font-size:12px;font-weight:700;color:var(--gym);padding-top:1px}
.gymday .n{font-size:13px;line-height:1.35}
.gymday .m{font-size:11px;color:var(--mut);margin-top:2px}
.gymday .k{font-size:13px;font-weight:700;color:var(--gym);white-space:nowrap}
.sfb{margin-bottom:12px}
.sfb p{font-size:13px;line-height:1.45}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;margin-right:7px;text-transform:uppercase;letter-spacing:.4px;vertical-align:1px}
.sfb ul{list-style:none;margin-top:5px}
.sfb li{font-size:12px;color:var(--mut);line-height:1.45}
.sfb li:before{content:'→ ';color:var(--txt)}
.slp svg{width:100%;height:auto;display:block}
.sleg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:6px}
.sleg strong{color:var(--txt)}
.stiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stile{background:var(--card2);border-radius:12px;padding:8px 9px}
.stile .k{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.stile .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stile .v small{font-size:11px;color:var(--mut);font-weight:600;margin-left:2px}
footer{font-size:11px;color:#55575f;text-align:center;margin-top:8px}
</style></head><body>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
let D0=D; const T=D.targets; let days=Object.keys(D.days).sort();
const MC={protein:'#a970ff',fat:'#ffd23f',carbs:'#89cff0',fiber:'#a0703c'};
const C={green:'#34d17a',amber:'#ffb020',red:'#ff4d5e',blue:'#4da3ff',gym:'#c86bff',track:'#26272c'};
const r1=x=>Math.round(x*10)/10, fmt=x=>(Math.round(x*10)/10).toLocaleString('en-US');
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TYPE={z2:'Easy / Z2',hit:'Hard / HIT',rest:'Rest'};
function totals(day){const t={kcal:0,protein:0,carbs:0,fat:0,fiber:0};(day.meals||[]).forEach(m=>{for(const k in t)t[k]+=+m[k]||0});for(const k in t)t[k]=r1(t[k]);return t}
function carbT(type){const c=T.carbs,g=c[type]??c.z2,p=(c.tolerance_pct??10)/100;return{min:Math.round(g*(1-p)),max:Math.round(g*(1+p)),ideal:g}}
function burnOf(day){const b=day.burn||{};return (b.baseline??T.calories.baseline)+(b.exercise||0)}
// status: returns [color,label]
function status(key,v,t){
  if(v<t.min) return [C.amber,'Under · '+fmt(t.min-v)+' g to go'];
  if(v<=t.max) return [C.green,'In range'];
  if(key==='protein'||key==='fiber') return [C.blue,'Above range'];
  return v>t.max*1.1?[C.red,'Over · +'+fmt(v-t.max)+' g']:[C.amber,'Slightly over · +'+fmt(v-t.max)+' g'];
}
function ring(v,t,col,unit,sub){
  const R=52,cx=64,cy=64,L=2*Math.PI*R, f=v/t.ideal;
  const a1=Math.min(f,1), a2=Math.max(0,Math.min(f-1,1));
  // range marks at min & max
  const mark=(x,c)=>{const ang=2*Math.PI*Math.min(x/t.ideal,1.999)-Math.PI/2;const i=R-9,o=R+9;
    return `<line x1="${cx+i*Math.cos(ang)}" y1="${cy+i*Math.sin(ang)}" x2="${cx+o*Math.cos(ang)}" y2="${cy+o*Math.sin(ang)}" stroke="${c}" stroke-width="2" stroke-linecap="round" opacity=".55"/>`};
  return `<svg viewBox="0 0 128 128">
   <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${C.track}" stroke-width="13"/>
   <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
     stroke-dasharray="${a1*L} ${L}" transform="rotate(-90 ${cx} ${cy})" opacity="${a2>0?.55:1}"/>
   ${a2>0?`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
     stroke-dasharray="${a2*L} ${L}" transform="rotate(-90 ${cx} ${cy})"/>`:''}
   ${t.min<t.ideal?mark(t.min,'#fff'):''}${t.max/t.ideal<=1.999&&t.max>t.ideal&&a1<1?'':''}
   <text x="${cx}" y="${cy+2}" text-anchor="middle" fill="#f2f2f5" font-size="27" font-weight="800">${unit==='min'||unit==='days'?Math.round(v):fmt(v)}</text>
   <text x="${cx}" y="${cy+21}" text-anchor="middle" fill="#8b8d96" font-size="12" font-weight="600">${sub||('/ '+t.ideal+' '+(unit||'g'))}</text>
  </svg>`;
}
function render(ds){
  const day=D.days[ds], tot=totals(day), type=day.type||'z2';
  const i=days.indexOf(ds);
  document.getElementById('prev').disabled=i<=0; document.getElementById('next').disabled=i>=days.length-1;
  const dt=pd(ds);
  document.getElementById('dtitle').innerHTML=`${WD[dt.getDay()]} ${MO[dt.getMonth()]} ${dt.getDate()}<span class="chip ${type}">${TYPE[type]||type}</span>`;
  document.getElementById('picker').value=ds;
  document.getElementById('dnote').textContent='actual / target';
  const defs=[['protein','Protein',T.protein],['carbs','Carbs',carbT(type)],['fat','Fat',T.fat],['fiber','Fiber',T.fiber]];
  document.getElementById('rings').innerHTML=defs.map(([k,lab,t])=>{const[col,st]=status(k,tot[k],t);
    return `<div class="ring">${ring(tot[k],t,MC[k]||col)}<div class="lab">${lab}</div><div class="st" style="color:${col}">${st}</div><div class="rg">range ${t.min}–${t.max} g</div></div>`}).join('');
  // calories
  const b=day.burn||{}, base=b.baseline??T.calories.baseline, ex=b.exercise||0, burn=base+ex, net=r1(tot.kcal-burn);
  const isToday=ds===iso(new Date());
  const scale=Math.max(tot.kcal,burn)*1.08, pct=x=>(x/scale*100).toFixed(2)+'%';
  const eatCol=tot.kcal>burn*1.1?C.red:tot.kcal>=burn*0.9?C.green:C.amber;
  const netCol=Math.abs(net)<=burn*0.1?C.green:net>0?C.red:C.amber;
  document.getElementById('cal').innerHTML=`<h2>Calories <span>target = baseline + exercise</span></h2>
   <div class="calrow"><div><div class="big">${fmt(tot.kcal)}<small>/ ${fmt(burn)} kcal</small></div></div>
   <div class="net"><div class="v" style="color:${netCol}">${isToday&&net<0?fmt(-net):(net>0?'+':'')+fmt(net)}</div><div class="k">${isToday&&net<0?'kcal left to eat':'net kcal '+(net>0?'surplus':'deficit')}</div></div></div>
   <div class="bar"><i style="width:${pct(tot.kcal)};background:var(--cal)"></i><b style="left:${pct(burn)}"></b></div>
   <div class="bar"><i style="width:${pct(base)};background:#5a4fd6"></i><i style="left:${pct(base)};width:${pct(ex)};background:var(--burn);border-radius:0 7px 7px 0"></i></div>
   <div class="legend"><span><span class="dot" style="background:var(--cal)"></span>Eaten <strong>${fmt(tot.kcal)}</strong></span>
   <span><span class="dot" style="background:var(--burn)"></span>Burned <strong>${fmt(burn)}</strong></span></div>
   <div class="burnsplit">Baseline ${fmt(base)} + exercise ${fmt(ex)} kcal${b.notes?' · '+esc(b.notes):''}</div>`;
  // meals
  const ms=(day.meals||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
  document.getElementById('mcount').textContent=ms.length+' item'+(ms.length==1?'':'s');
  document.getElementById('meals').innerHTML=ms.length?ms.map(m=>`<div class="meal"><div class="t">${m.time}</div>
    <div><div class="n">${esc(m.name)}</div><div class="m"><em>P ${fmt(m.protein)}</em><em>C ${fmt(m.carbs)}</em><em>F ${fmt(m.fat)}</em><em>Fib ${fmt(m.fiber)}</em></div></div>
    <div class="k">${fmt(m.kcal)}</div></div>`).join('')+
    `<div class="tot"><div>Total</div><div><div class="m">P ${fmt(tot.protein)} · C ${fmt(tot.carbs)} · F ${fmt(tot.fat)} · Fib ${fmt(tot.fiber)}</div></div><div>${fmt(tot.kcal)}</div></div>`
    :'<div class="empty">No entries yet.</div>';
  renderTrend(ds); renderWeek(ds); renderSleep(ds);
  if(location.hash.slice(1)!==ds) history.replaceState(null,'','#'+ds);
}
function renderWeek(ds){
  const d0=pd(ds), ws=new Date(d0); ws.setDate(d0.getDate()-((d0.getDay()+6)%7));
  const we=new Date(ws); we.setDate(ws.getDate()+6);
  const wk=((D.training||{}).weeks||{})[iso(ws)]||{z2_bike:0,z5_all:0,gym_min:0,gym_days:0,gym:{},sessions:[]};
  const cur=iso(ws)===(()=>{const n=new Date(),m=new Date(n);m.setDate(n.getDate()-((n.getDay()+6)%7));return iso(m)})();
  document.getElementById('wktitle').textContent=cur?'This week':'Week of '+MO[ws.getMonth()]+' '+ws.getDate();
  document.getElementById('wkrange').textContent=`${MO[ws.getMonth()]} ${ws.getDate()} – ${MO[we.getMonth()]} ${we.getDate()} · Mon–Sun`;
  const g2=T.z2_week||300, lo=T.z5_week_low||20, hi=T.z5_week_high||24;
  const z2=wk.z2_bike||0, z5=wk.z5_all||0, R=Math.round;
  const c2=z2>=g2?[C.green,'Goal met'+(z2>g2?' · +'+R(z2-g2)+' min':'')]:[C.amber,R(g2-z2)+' min to go'];
  const gg=T.gym_sessions_week||4, gd=wk.gym_sessions||0;   // weekly minimum of gym sessions
  const cg=gd>=gg?[C.green,'Goal met'+(gd>gg?' · +'+(gd-gg):'')]:[C.amber,cur?(gg-gd)+' to go':(gg-gd)+' short'];
  const c5=z5<lo?[C.amber,R(lo-z5)+' min to band']:z5<=hi?[C.green,'In band']:z5<=30?[C.blue,'Just above band · +'+R(z5-hi)]:[C.amber,'Well over · +'+R(z5-hi)+' min, ease off'];
  document.getElementById('wkrings').innerHTML=
   `<div class="ring">${ring(z2,{min:g2,max:g2,ideal:g2},c2[0],'min')}<div class="lab">Z2 bike</div><div class="st" style="color:${c2[0]}">${c2[1]}</div><div class="rg"><b>${R(z2)} / ${g2} min</b></div></div>`+
   `<div class="ring">${ring(z5,{min:lo,max:hi,ideal:hi},c5[0],'min','/ '+lo+'–'+hi+' min')}<div class="lab">Z5 all</div><div class="st" style="color:${c5[0]}">${c5[1]}</div><div class="rg"><b>${R(z5)} / ${lo}–${hi} min</b></div></div>`+
   `<div class="ring">${ring(gd,{min:gg,max:gg,ideal:gg},C.gym,'sessions','/ '+gg+'+')}<div class="lab">Gym</div><div class="st" style="color:${cg[0]}">${cg[1]}</div><div class="rg"><b>${gd} / ${gg} sessions</b></div></div>`;
  // per-day bars: Z2 bike (green) with Z5 minutes (red) in the label row
  const W=460,H=96,pl=6,pr=6,pt=16,pb=30,cw=(W-pl-pr)/7, per=[];
  for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);const s=iso(d);
    const ss=(wk.sessions||[]).filter(x=>x.d===s), g=(wk.gym||{})[s];
    per.push([d,ss.reduce((a,x)=>a+x.z2,0),ss.reduce((a,x)=>a+x.z5,0),ss.length+(g&&g.src==='manual'?1:0),g?Math.max(g.min||0,0):-1])}
  const mx=Math.max(60,...per.map(p=>Math.max(p[1],p[4]))), y=v=>pt+(H-pt-pb)*(1-v/mx);
  let s=`<svg class="wd" viewBox="0 0 ${W} ${H}"><line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="#26272c"/>`;
  per.forEach(([d,a,b,n,g],i)=>{const cx=pl+i*cw+cw/2,sel=iso(d)===ds;
    // Z2 bike bar (green) left of centre, gym bar (purple, narrow) right of it
    const bw=cw*.38, bx=cx-cw*.27, gw=cw*.14, gx=cx+cw*.15;
    if(a>0){s+=`<rect x="${bx}" y="${y(a)}" width="${bw}" height="${y(0)-y(a)}" rx="3" fill="${C.green}" opacity="${sel?1:.7}"/><text x="${bx+bw/2}" y="${y(a)-4}" fill="#8b8d96" font-size="11" text-anchor="middle">${R(a)}</text>`}
    if(g>0){const gh=Math.max(3,y(0)-y(g));s+=`<rect x="${gx}" y="${y(0)-gh}" width="${gw}" height="${gh}" rx="2" fill="${C.gym}" opacity="${sel?1:.8}"/><text x="${gx+gw/2}" y="${y(0)-gh-4}" fill="${C.gym}" font-size="9.5" font-weight="600" text-anchor="middle">${R(g)}</text>`}
    else if(g===0){s+=`<circle cx="${gx+gw/2}" cy="${y(0)-4}" r="3.5" fill="${C.gym}"/>`}
    s+=`<text x="${cx}" y="${H-16}" fill="${sel?'#f2f2f5':'#6b6d76'}" font-size="11" text-anchor="middle" font-weight="${sel?700:400}">${WD[d.getDay()][0]}${d.getDate()}</text>`;
    s+=`<text x="${cx}" y="${H-3}" fill="${b>0?C.red:'#3a3b42'}" font-size="10" text-anchor="middle" font-weight="600">${b>0?'Z5 '+R(b):(n?'·':'')}</text>`});
  document.getElementById('wkdays').innerHTML=`<div class="tl" style="margin-top:10px"><span class="dot" style="background:${C.green}"></span>Z2 bike min · <span class="dot" style="background:${C.gym}"></span>Gym min · <span style="color:${C.red}">Z5 min</span> · ${(()=>{const n=(wk.sessions||[]).filter(x=>x.kind!=='gym').length;return n+' ride'+(n==1?'':'s')})()} · ${wk.gym_sessions||0} gym session${wk.gym_sessions==1?'':'s'}</div>`+s+'</svg>';
}
function gymOf(ds){const d0=pd(ds),ws=new Date(d0);ws.setDate(d0.getDate()-((d0.getDay()+6)%7));
  const w=((D.training||{}).weeks||{})[iso(ws)];return w&&w.gym?w.gym[ds]:null}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderTrend(ds){
  const end=pd(ds), list=[];
  for(let k=6;k>=0;k--){const d=new Date(end);d.setDate(d.getDate()-k);const s=iso(d);list.push([s,d,D.days[s]])}
  document.getElementById('trange').textContent=`${MO[list[0][1].getMonth()]} ${list[0][1].getDate()} – ${MO[end.getMonth()]} ${end.getDate()}`;
  const W=460,H=120,pl=34,pr=6,pt=8,pb=20,cw=(W-pl-pr)/7;
  function chart(title,getV,getT,maxV,band,unit,color){
    const y=v=>pt+(H-pt-pb)*(1-Math.min(v,maxV)/maxV);
    let s=`<svg viewBox="0 0 ${W} ${H}">`;
    if(band) s+=`<rect x="${pl}" y="${y(band[1])}" width="${W-pl-pr}" height="${y(band[0])-y(band[1])}" fill="#34d17a" opacity=".10"/>`;
    [0,maxV/2,maxV].forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#26272c"/><text x="${pl-5}" y="${y(v)+4}" fill="#6b6d76" font-size="10" text-anchor="end">${Math.round(v)}</text>`});
    list.forEach(([s2,d,day],i)=>{const x=pl+i*cw, cx=x+cw/2, sel=s2===ds;
      s+=`<text x="${cx}" y="${H-5}" fill="${sel?'#f2f2f5':'#6b6d76'}" font-size="10" text-anchor="middle" font-weight="${sel?700:400}">${WD[d.getDay()][0]}${d.getDate()}</text>`;
      if(!day){s+=`<text x="${cx}" y="${y(0)-4}" fill="#3a3b42" font-size="10" text-anchor="middle">–</text>`;return}
      const v=getV(day), t=getT(day), bw=cw*0.52;
      s+=`<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" rx="3" fill="${color(v,t,day)}" opacity="${sel?1:.7}"/>`;
      if(t!=null) s+=`<line x1="${cx-cw*0.42}" x2="${cx+cw*0.42}" y1="${y(t)}" y2="${y(t)}" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`;
    });
    return `<div class="tl">${title}</div>`+s+'</svg>';
  }
  const pc=(v)=>v<T.protein.min?C.amber:v<=T.protein.max?C.green:C.blue;
  const kc=(v,t)=>v>t*1.1?C.red:v>=t*0.9?C.green:C.amber;
  let maxK=0; list.forEach(([, ,day])=>{if(day)maxK=Math.max(maxK,totals(day).kcal,burnOf(day))});
  maxK=Math.ceil(maxK*1.1/500)*500||3000;
  const maxP=Math.max(200,...list.filter(x=>x[2]).map(x=>totals(x[2]).protein))*1.05;
  document.getElementById('trend').innerHTML=
    chart('Protein (g) · band = 130–170, line = 150',d=>totals(d).protein,()=>T.protein.ideal,Math.ceil(maxP/50)*50,[T.protein.min,T.protein.max],'g',pc)+
    chart('Calories eaten · line = baseline + exercise',d=>totals(d).kcal,d=>burnOf(d),maxK,null,'kcal',kc);
}
// ---- Oura sleep card (D.sleep keyed by wake-up date = Oura `day`) ----
const SC={deep:'#3a56e8',rem:'#22d3c5',light:'#9fd3ff',awake:'#ff8a3d'};
const hm=m=>m==null?'–':(Math.floor(m/60)?Math.floor(m/60)+'h ':'')+String(Math.round(m%60)).padStart(Math.floor(m/60)?2:1,'0')+'m';
const sCol=v=>v==null?'#f2f2f5':v>=85?C.green:v>=70?C.amber:C.red;
function sleepFeedback(ds,s){
  if(s.total==null) return '';
  const tot=s.total, pc=x=>tot?x/tot*100:0, flags=[];
  const add=(k,l,txt)=>{if(l>0)flags.push({k,l,txt})};
  add('total',tot>=420?0:tot>=360?1:2,'sleep was short');
  if(s.eff!=null) add('eff',s.eff>=85?0:s.eff>=78?1:2,'efficiency was '+s.eff+'%');
  if(s.deep!=null) add('deep',(s.deep>=90||pc(s.deep)>=15)?0:s.deep>=60?1:2,'deep sleep was low');
  if(s.rem!=null) add('rem',(s.rem>=90||pc(s.rem)>=20)?0:s.rem>=60?1:2,'REM was low');
  if(s.lat!=null&&s.lat>30) add('lat',1,'you took '+s.lat+' min to fall asleep');
  // 14-day rolling baseline for resting HR / HRV (needs >= 3 prior nights)
  const pr=[]; for(let k=1;k<=14;k++){const d=pd(ds);d.setDate(d.getDate()-k);const p=(D.sleep||{})[iso(d)];if(p)pr.push(p)}
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const rh=pr.map(p=>p.rhr).filter(x=>x!=null), hv=pr.map(p=>p.hrv).filter(x=>x!=null);
  const bR=rh.length>=3?mean(rh):null, bH=hv.length>=3?mean(hv):null;
  if(bR&&s.rhr!=null){const d=(s.rhr-bR)/bR*100; add('rhr',d>=10?2:d>=5?1:0,'resting HR was '+Math.round(d)+'% above baseline')}
  if(bH&&s.hrv!=null){const d=(bH-s.hrv)/bH*100; add('hrv',d>=20?2:d>=10?1:0,'HRV was '+Math.round(d)+'% below baseline')}
  let v=Math.max(0,...flags.map(f=>f.l));
  if(v===1&&s.score>=85&&(s.ready??85)>=80) v=0;            // Oura scores can nudge up...
  if(s.score<70||s.ready<70) v=Math.min(2,v+1);              // ...or down
  const V=[['Good',C.green],['Okay',C.amber],['Needs attention',C.red]][v];
  const ord=['total','rhr','hrv','deep','rem','eff','lat'];
  flags.sort((a,b)=>b.l-a.l||ord.indexOf(a.k)-ord.indexOf(b.k));
  const TIP={total:'Lights out 30 min earlier, same time each night.',deep:'No late caffeine or alcohol; keep the bedroom cool.',
    rem:'Skip early alarms to protect your last REM cycle.',eff:'Screens off 45 min before bed, then a wind-down.',
    lat:'Screens off 45 min before bed, then a wind-down.',rhr:'Consider an easy day and extra fluids today.',hrv:'Consider an easy day and extra fluids today.'};
  const tips=[...new Set(flags.map(f=>TIP[f.k]))].slice(0,2);
  const and=a=>a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a[0];
  let txt=flags.length
    ? `${v===2?'Rough night':v===1?'Okay night':'Good night overall'}: ${hm(tot)} asleep, but ${and(flags.slice(0,2).map(f=>f.txt))}.`
    : `Solid night: ${hm(tot)} asleep with ${hm(s.deep)} deep and ${hm(s.rem)} REM.`;
  if(tips.length<2){
    if(!bR&&!bH) txt+=` Your resting HR and HRV baseline is still building (${Math.min(rh.length,hv.length)} of 3 nights).`;
    else if(!flags.some(f=>f.k==='rhr'||f.k==='hrv')) txt+=` Resting HR ${s.rhr??'–'} and HRV ${s.hrv??'–'} are in line with your baseline.`;
  }
  return `<div class="sfb"><p><span class="pill" style="background:${V[1]}22;color:${V[1]}">${V[0]}</span>${esc(txt)}</p>`+
    (tips.length?`<ul>${tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'')+'</div>';
}
function hypno(s){
  const W=460,H=150,pl=46,pr=8,pt=6,pb=22,n=s.hyp.length,span=Math.max(s.span||0,n*5),lh=(H-pt-pb)/4,x=m=>pl+(W-pl-pr)*m/span;
  const lane={'4':0,'3':1,'2':2,'1':3}, nm=['Awake','REM','Light','Deep'], col=[SC.awake,SC.rem,SC.light,SC.deep];
  let g=`<svg viewBox="0 0 ${W} ${H}">`, path='', rects='';
  nm.forEach((t,i)=>{g+=`<rect x="${pl}" y="${pt+i*lh}" width="${W-pl-pr}" height="${lh}" fill="${i%2?'#15161a':'#1a1b1f'}"/><text x="${pl-6}" y="${pt+i*lh+lh/2+4}" fill="${col[i]}" font-size="11" font-weight="600" text-anchor="end">${t}</text>`});
  for(let i=0;i<n;){const c=s.hyp[i];let j=i;while(j<n&&s.hyp[j]===c)j++;const L=lane[c];
    if(L!=null){const x0=x(i*5),x1=x(j*5),yc=pt+L*lh+lh/2;
      rects+=`<rect x="${x0}" y="${yc-lh*0.32}" width="${Math.max(1.2,x1-x0)}" height="${lh*0.64}" rx="2" fill="${col[L]}"/>`;
      path+=(path?'L':'M')+x0+','+yc+'L'+x1+','+yc}
    i=j}
  g+=`<path d="${path}" fill="none" stroke="#f2f2f5" stroke-width="1" opacity=".3"/>`+rects;
  const ck=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
  const step=span>360?120:60, y0=H-6;
  for(let t=Math.ceil(s.start_min/step)*step;t<s.start_min+span;t+=step){const m=t-s.start_min;if(m<70||span-m<70)continue;
    g+=`<line x1="${x(m)}" x2="${x(m)}" y1="${pt}" y2="${H-pb}" stroke="#2c2d33" stroke-dasharray="2 3"/><text x="${x(m)}" y="${y0}" fill="#6b6d76" font-size="10" text-anchor="middle">${ck(t)}</text>`}
  g+=`<text x="${pl}" y="${y0}" fill="#f2f2f5" font-size="11" font-weight="700">${s.start||ck(s.start_min)}</text><text x="${W-pr}" y="${y0}" fill="#f2f2f5" font-size="11" font-weight="700" text-anchor="end">${s.end||ck(s.start_min+span)}</text>`;
  return `<div class="tl">Bedtime ${s.start||''} → wake ${s.end||''}</div>`+g+'</svg>';
}
function stageBar(s){
  const st=[['Deep',s.deep,SC.deep],['REM',s.rem,SC.rem],['Light',s.light,SC.light],['Awake',s.awake,SC.awake]].filter(x=>x[1]!=null);
  const sum=st.reduce((a,x)=>a+x[1],0); if(!sum) return '';
  let left=0;
  const bar=st.map(([k,m,c])=>{const w=m/sum*100,h=`<i style="left:${left}%;width:${w}%;background:${c};border-radius:0"></i>`;left+=w;return h}).join('');
  return `<div class="tl" style="margin-top:12px">Time in each stage</div><div class="bar" style="height:16px">${bar}</div>
   <div class="sleg">${st.map(([k,m,c])=>`<span><span class="dot" style="background:${c}"></span>${k} <strong>${hm(m)}</strong> · ${Math.round(m/sum*100)}%</span>`).join('')}</div>`;
}
function sleepTrend(ds){
  const S=D.sleep||{}, end=pd(ds), L=[];
  for(let k=6;k>=0;k--){const d=new Date(end);d.setDate(d.getDate()-k);L.push([iso(d),d,S[iso(d)]])}
  const useScore=L.some(x=>x[2]&&x[2].score!=null), key=useScore?'score':'hrv';
  const W=460,H=110,pl=30,pr=6,pt=14,pb=18,cw=(W-pl-pr)/7, mh=10, y=v=>pt+(H-pt-pb)*(1-Math.min(v,mh)/mh);
  const mx2=useScore?100:Math.max(60,...L.map(x=>x[2]&&x[2].hrv||0))*1.15, y2=v=>pt+(H-pt-pb)*(1-v/mx2);
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  [0,5,10].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#26272c"/><text x="${pl-5}" y="${y(v)+4}" fill="#6b6d76" font-size="10" text-anchor="end">${v}h</text>`});
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(7)}" y2="${y(7)}" stroke="#fff" stroke-dasharray="3 3" opacity=".35"/>`;
  const pts=[];
  L.forEach(([s2,d,n],i)=>{const cx=pl+i*cw+cw/2,sel=s2===ds,bw=cw*.5;
    g+=`<text x="${cx}" y="${H-4}" fill="${sel?'#f2f2f5':'#6b6d76'}" font-size="10" text-anchor="middle" font-weight="${sel?700:400}">${WD[d.getDay()][0]}${d.getDate()}</text>`;
    if(n&&n.total!=null){const h=n.total/60;g+=`<rect x="${cx-bw/2}" y="${y(h)}" width="${bw}" height="${y(0)-y(h)}" rx="3" fill="${SC.deep}" opacity="${sel?1:.65}"/>`}
    if(n&&n[key]!=null) pts.push([cx,y2(n[key]),n[key]])});
  if(pts.length>1) g+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="${SC.rem}" stroke-width="1.5" opacity=".7"/>`;
  pts.forEach(p=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${SC.rem}"/><text x="${p[0]}" y="${p[1]-6}" fill="${SC.rem}" font-size="10" font-weight="600" text-anchor="middle">${Math.round(p[2])}</text>`});
  return `<div class="tl" style="margin-top:12px"><span class="dot" style="background:${SC.deep}"></span>Hours asleep (line = 7 h) · <span class="dot" style="background:${SC.rem}"></span>${useScore?'Sleep score':'HRV (ms)'}</div>`+g+'</svg>';
}
function renderSleep(ds){
  const el=document.getElementById('sleep'), s=(D.sleep||{})[ds], dt=pd(ds), pv=new Date(dt); pv.setDate(dt.getDate()-1);
  document.getElementById('srange').textContent=`Night of ${MO[pv.getMonth()]} ${pv.getDate()} → ${MO[dt.getMonth()]} ${dt.getDate()}`;
  if(!s||(s.total==null&&s.score==null&&s.ready==null)){el.innerHTML='<div class="empty">No Oura sleep yet for this night.</div>';return}
  const t=(k,v,u,c)=>`<div class="stile"><div class="k">${k}</div><div class="v" style="color:${c||'#f2f2f5'}">${v==null?'–':v}${v!=null&&u?`<small>${u}</small>`:''}</div></div>`;
  const tiles=[t('Total sleep',s.total!=null?hm(s.total):null),t('Time in bed',s.tib!=null?hm(s.tib):null),
    t('Efficiency',s.eff,'%',s.eff==null?null:s.eff>=85?C.green:s.eff>=78?C.amber:C.red),
    t('Sleep score',s.score,'',sCol(s.score)),t('Readiness',s.ready,'',sCol(s.ready)),t('Lowest HR',s.rhr,'bpm'),
    t('Avg HRV',s.hrv,'ms'),t('Temp dev',s.temp==null?null:(s.temp>0?'+':'')+s.temp.toFixed(1),'°C',s.temp==null?null:Math.abs(s.temp)>=1?C.red:Math.abs(s.temp)>=0.5?C.amber:null),
    t('Latency',s.lat,'min')];
  if(s.spo2!=null) tiles.push(t('SpO₂',r1(s.spo2),'%'));
  if(s.breath!=null) tiles.push(t('Breathing',r1(s.breath),'/min'));
  const naps=(s.naps||[]).map(n=>`${n.start||''}–${n.end||''} · ${hm(n.min)}`).join(', ');
  el.innerHTML=sleepFeedback(ds,s)+(s.hyp&&s.start_min!=null?hypno(s):'')+stageBar(s)+
    `<div class="stiles">${tiles.join('')}</div>`+(naps?`<div class="tl" style="margin-top:8px">Naps: ${esc(naps)}</div>`:'')+sleepTrend(ds);
}
const pk=document.getElementById('picker');
function fillPicker(){pk.innerHTML=days.slice().reverse().map(d=>`<option value="${d}">${d}</option>`).join('')}
fillPicker();
pk.onchange=()=>render(pk.value);
document.getElementById('prev').onclick=()=>{const i=days.indexOf(pk.value);if(i>0)render(days[i-1])};
document.getElementById('next').onclick=()=>{const i=days.indexOf(pk.value);if(i<days.length-1)render(days[i+1])};
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(D.days[h]&&h!==pk.value)render(h)});
const h0=location.hash.slice(1); render(D.days[h0]?h0:days[days.length-1]);
// Live refresh: pull data.json (cache-busted) on load, when the app regains focus, and every 60 s while visible.
let lastJSON=JSON.stringify(D), busy=false;
async function refresh(){
  if(busy||location.protocol==='file:')return; busy=true;
  try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok)return;
    const txt=await r.text(); const nd=JSON.parse(txt); const js=JSON.stringify(nd); if(js===lastJSON)return;
    const wasLatest=pk.value===days[days.length-1]; lastJSON=js;
    for(const k in D.days) delete D.days[k]; Object.assign(D.days,nd.days); Object.assign(T,nd.targets); if(nd.training) D.training=nd.training; if(nd.sleep) D.sleep=nd.sleep;
    days=Object.keys(D.days).sort(); fillPicker();
    render(wasLatest||!D.days[pk.value]?days[days.length-1]:pk.value);
    if(nd.built) document.getElementById('foot').textContent='Updated '+nd.built;
  }catch(e){}finally{busy=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.addEventListener('focus',refresh); window.addEventListener('pageshow',refresh);
setInterval(()=>{if(!document.hidden)refresh()},60000); refresh();
</script></body></html>
